production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  rails_pulse_summary:
    class: RailsPulse::SummaryJob
    queue: default
    schedule: every hour at minute 5
    description: "Roll up Rails Pulse raw records into summary tables"

  rails_pulse_cleanup:
    class: RailsPulse::CleanupJob
    queue: default
    schedule: every day at 1am
    description: "Archive/purge old Rails Pulse data"

  sqlite_maintenance:
    class: SqliteMaintenanceJob
    queue: default
    schedule: "every day at 3:30am"
    description: "VACUUM + PRAGMA optimize across SQLite databases"

  slack_job_sweep:
    class: Hiring::SlackJobSweepJob
    queue: default
    schedule: every hour at minute 20
    description: "Close #jobs Slack messages for jobs that have expired"

  credential_expiry:
    class: Credentials::ExpiryJob
    queue: default
    schedule: every hour at minute 35
    description: "Mark credentials past their configured expiry date as expired"
